<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScoutOps</title>
    <style>
      :root {
        --bg: #07151d;
        --panel: #0d1d2a;
        --panel-alt: #102936;
        --line: rgba(149, 196, 223, 0.2);
        --text: #ebf4ff;
        --muted: #99afc3;
        --accent: #6ec9ff;
        --accent-2: #5fe0c7;
        --warning: #f9c74f;
        --danger: #ff6b6b;
        --success: #4ad66d;
        --shadow: rgba(2, 12, 18, 0.5);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #050d12 0%, var(--bg) 100%);
        color: var(--text);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.2rem 2rem;
        border-bottom: 1px solid var(--line);
        background: rgba(7, 21, 29, 0.75);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }

      .brand-mark {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--accent) 0%, #0b3a59 35%, #07151d 70%);
        border: 2px solid rgba(110, 201, 255, 0.7);
        box-shadow: 0 0 20px rgba(110, 201, 255, 0.5);
      }

      .brand-text h1 {
        margin: 0;
        font-size: 1.6rem;
        letter-spacing: 0.12em;
      }

      .brand-text small {
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(12, 40, 52, 0.8);
        border: 1px solid rgba(110, 201, 255, 0.3);
        border-radius: 999px;
        padding: 0.5rem 0.9rem;
        font-size: 0.85rem;
        color: var(--accent-2);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        background: var(--success);
        box-shadow: 0 0 12px rgba(74, 214, 109, 0.9);
      }

      .layout {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem;
      }

      .dashboard {
        display: grid;
        grid-template-columns: repeat(4, minmax(180px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .card {
        background: linear-gradient(180deg, rgba(12, 28, 38, 0.98), rgba(11, 23, 34, 0.95));
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 1rem 1.1rem;
        box-shadow: 0 12px 30px var(--shadow);
      }

      .card h3 {
        margin: 0 0 0.5rem;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .card strong {
        font-size: 1.8rem;
        display: block;
      }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
        gap: 1.5rem;
      }

      form {
        display: grid;
        gap: 0.85rem;
      }

      .field,
      select,
      input,
      textarea {
        width: 100%;
        background: rgba(9, 20, 28, 0.9);
        border: 1px solid rgba(132, 189, 220, 0.2);
        border-radius: 10px;
        color: var(--text);
        padding: 0.8rem 0.9rem;
        font-size: 0.96rem;
      }

      textarea {
        min-height: 100px;
        resize: vertical;
      }

      label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.85rem;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 0.9rem 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), #2ca7d8);
        color: #021018;
      }

      .secondary {
        background: rgba(94, 224, 199, 0.12);
        border: 1px solid rgba(94, 224, 199, 0.4);
        color: var(--accent-2);
      }

      .list-wrap {
        min-height: 300px;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }

      .toolbar h2 {
        margin: 0;
      }

      .issue-list {
        display: grid;
        gap: 1rem;
      }

      .issue-item {
        background: rgba(10, 22, 30, 0.95);
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        border-radius: 14px;
        padding: 1rem;
      }

      .issue-header {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .issue-title {
        font-size: 1.1rem;
        font-weight: 700;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0.75rem 0;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.28rem 0.6rem;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 0.71rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .priority-high { border-color: rgba(255, 107, 107, 0.6); color: #ffd4d4; }
      .priority-medium { border-color: rgba(249, 199, 79, 0.6); color: #ffe9b5; }
      .priority-low { border-color: rgba(94, 224, 199, 0.6); color: #c3fff4; }
      .status-open { color: #bff6ff; }
      .status-assigned { color: #d7d9ff; }
      .status-in_progress { color: #fbd277; }
      .status-resolved { color: #a4f7c4; }
      .status-closed { color: #d0d7de; }

      .issue-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .small {
        padding: 0.55rem 0.8rem;
        font-size: 0.85rem;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 2rem 1rem;
      }

      .alerts {
        margin-top: 1rem;
        min-height: 24px;
      }

      .alert {
        border-radius: 8px;
        padding: 0.7rem 0.9rem;
        margin-top: 0.5rem;
        font-size: 0.9rem;
      }

      .alert.success {
        background: rgba(74, 214, 109, 0.12);
        border: 1px solid rgba(74, 214, 109, 0.4);
        color: #d9ffe5;
      }

      .alert.error {
        background: rgba(255, 107, 107, 0.1);
        border: 1px solid rgba(255, 107, 107, 0.3);
        color: #ffd0d0;
      }

      .health-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .dashboard { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
        .content-grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 600px) {
        .layout { padding: 1rem; }
        .dashboard { grid-template-columns: 1fr; }
        .row { grid-template-columns: 1fr; }
        .topbar { padding: 1rem; }
        .brand-text h1 { font-size: 1.2rem; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div class="brand-text">
          <h1>SCOUTOPS</h1>
          <small>Find. Track. Resolve.</small>
        </div>
      </div>
      <div class="status-pill"><span class="dot"></span>Operations Healthy</div>
    </header>

    <main class="layout">
      <section class="dashboard" id="dashboard"></section>

      <section class="content-grid">
        <aside class="card">
          <div class="toolbar">
            <h2>Report Issue</h2>
          </div>
          <form id="issue-form">
            <div>
              <label for="title">Title</label>
              <input id="title" name="title" type="text" placeholder="Broken lighting in East Wing" required />
            </div>

            <div>
              <label for="description">Description</label>
              <textarea id="description" name="description" placeholder="Describe the issue in detail..." required></textarea>
            </div>

            <div class="row">
              <div>
                <label for="category">Category</label>
                <select id="category" name="category" required>
                  <option value="ELECTRICAL">Electrical</option>
                  <option value="PLUMBING">Plumbing</option>
                  <option value="INTERNET">Internet</option>
                  <option value="CLEANING">Cleaning</option>
                  <option value="FURNITURE">Furniture</option>
                  <option value="EQUIPMENT">Equipment</option>
                  <option value="SECURITY">Security</option>
                  <option value="OTHER">Other</option>
                </select>
              </div>

              <div>
                <label for="priority">Priority</label>
                <select id="priority" name="priority" required>
                  <option value="LOW">Low</option>
                  <option value="MEDIUM" selected>Medium</option>
                  <option value="HIGH">High</option>
                  <option value="CRITICAL">Critical</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div>
                <label for="location">Location</label>
                <input id="location" name="location" type="text" placeholder="Library Annex" required />
              </div>

              <div>
                <label for="reporter_name">Reporter</label>
                <input id="reporter_name" name="reporter_name" type="text" placeholder="Student or staff name" required />
              </div>
            </div>

            <div>
              <label for="status">Status</label>
              <select id="status" name="status">
                <option value="OPEN">Open</option>
                <option value="ASSIGNED">Assigned</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="RESOLVED">Resolved</option>
                <option value="CLOSED">Closed</option>
              </select>
            </div>

            <div class="issue-actions">
              <button type="submit" class="primary">Submit Issue</button>
              <button type="button" class="secondary small" id="reset-form">Reset</button>
            </div>
          </form>

          <div class="alerts" id="alerts"></div>
        </aside>

        <section class="card list-wrap">
          <div class="toolbar">
            <h2>Issue Queue</h2>
            <button class="secondary small" id="refresh-btn" type="button">Refresh</button>
          </div>
          <div id="issue-list" class="issue-list"></div>
        </section>
      </section>
    </main>

    <script>
      const dashboard = document.getElementById('dashboard');
      const issueList = document.getElementById('issue-list');
      const issueForm = document.getElementById('issue-form');
      const alerts = document.getElementById('alerts');

      const setAlert = (message, type = 'success') => {
        alerts.innerHTML = `<div class="alert ${type}">${message}</div>`;
      };

      const badgeClass = (priority) => {
        const p = (priority || '').toUpperCase();
        if (p === 'CRITICAL') return 'priority-high';
        if (p === 'HIGH') return 'priority-high';
        if (p === 'MEDIUM') return 'priority-medium';
        return 'priority-low';
      };

      const statusClass = (status) => {
        const s = (status || '').toUpperCase().replace(/\s+/g, '_');
        return `status-${s.toLowerCase()}`;
      };

      const renderDashboard = (counts) => {
        const cards = [
          ['Open', counts.open || 0],
          ['Assigned', counts.assigned || 0],
          ['Resolved', counts.resolved || 0],
          ['Urgent', counts.critical || 0],
        ];

        dashboard.innerHTML = cards.map(([label, value]) => `
          <div class="card">
            <h3>${label}</h3>
            <strong>${value}</strong>
          </div>
        `).join('');
      };

      const renderIssues = (issues) => {
        if (!issues.length) {
          issueList.innerHTML = '<div class="empty">No issues found. Submit the first ScoutOps mission report.</div>';
          return;
        }

        issueList.innerHTML = issues.map((issue) => `
          <article class="issue-item">
            <div class="issue-header">
              <div>
                <div class="issue-title">${issue.title}</div>
                <div class="meta">
                  <span class="badge ${badgeClass(issue.priority)}">${issue.priority}</span>
                  <span class="badge ${statusClass(issue.status)}">${issue.status}</span>
                  <span class="badge">${issue.category}</span>
                </div>
              </div>
              <span class="badge">#${issue.id}</span>
            </div>
            <p>${issue.description}</p>
            <div class="meta">
              <span class="badge">Location: ${issue.location}</span>
              <span class="badge">Reporter: ${issue.reporter_name}</span>
              <span class="badge">Created: ${new Date(issue.created_at).toLocaleDateString()}</span>
            </div>
            <div class="issue-actions">
              <button class="secondary small" type="button" data-action="status" data-id="${issue.id}">Toggle Status</button>
              <button class="secondary small" type="button" data-action="delete" data-id="${issue.id}">Delete</button>
            </div>
          </article>
        `).join('');
      };

      const loadIssues = async () => {
        try {
          const response = await fetch('/api/issues');
          if (!response.ok) {
            throw new Error('Unable to load issues');
          }
          const issues = await response.json();
          renderIssues(issues);

          const counts = {
            open: issues.filter((issue) => issue.status === 'OPEN').length,
            assigned: issues.filter((issue) => issue.status === 'ASSIGNED').length,
            resolved: issues.filter((issue) => issue.status === 'RESOLVED' || issue.status === 'CLOSED').length,
            critical: issues.filter((issue) => issue.priority === 'CRITICAL').length,
          };

          renderDashboard(counts);
        } catch (error) {
          issueList.innerHTML = '<div class="empty">Failed to load issues. Check ScoutOps status and API availability.</div>';
        }
      };

      const refreshHealth = async () => {
        try {
          const response = await fetch('/health');
          const payload = await response.json();
          document.querySelector('.status-pill').innerHTML = `<span class="dot"></span>${payload.status === 'UP' ? 'Operations Healthy' : 'Operations Unstable'}`;
        } catch (error) {
          document.querySelector('.status-pill').innerHTML = '<span class="dot"></span>Operations Unstable';
        }
      };

      issueForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(issueForm).entries());

        try {
          const response = await fetch('/api/issues', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const body = await response.json();
          if (!response.ok) {
            throw new Error(body.error || 'Issue creation failed');
          }

          setAlert('Issue created successfully.', 'success');
          issueForm.reset();
          await loadIssues();
        } catch (error) {
          setAlert(error.message || 'Issue creation failed.', 'error');
        }
      });

      issueList.addEventListener('click', async (event) => {
        const button = event.target.closest('button');
        if (!button) return;

        const { action, id } = button.dataset;
        if (!id) return;

        try {
          if (action === 'delete') {
            const response = await fetch(`/api/issues/${id}`, { method: 'DELETE' });
            const body = await response.json();
            if (!response.ok) {
              throw new Error(body.error || 'Delete failed');
            }
            setAlert('Issue removed successfully.', 'success');
          }

          if (action === 'status') {
            const issueResponse = await fetch(`/api/issues/${id}`);
            const issue = await issueResponse.json();
            const nextStatus = issue.status === 'OPEN' ? 'ASSIGNED' : issue.status === 'ASSIGNED' ? 'IN_PROGRESS' : 'RESOLVED';
            const patchResponse = await fetch(`/api/issues/${id}/status`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: nextStatus }),
            });
            const patchBody = await patchResponse.json();
            if (!patchResponse.ok) {
              throw new Error(patchBody.error || 'Status update failed');
            }
            setAlert(`Issue status updated to ${patchBody.status}.`, 'success');
          }

          await loadIssues();
        } catch (error) {
          setAlert(error.message || 'Issue action failed.', 'error');
        }
      });

      document.getElementById('refresh-btn').addEventListener('click', async () => {
        await loadIssues();
        await refreshHealth();
      });

      document.getElementById('reset-form').addEventListener('click', () => issueForm.reset());

      loadIssues();
      refreshHealth();
    </script>
  </body>
</html>
