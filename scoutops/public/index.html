<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScoutOps</title>
    <style>
      :root {
        --bg: #07151d;
        --panel: #0d1d2a;
        --panel-alt: #102936;
        --line: rgba(149, 196, 223, 0.2);
        --text: #ebf4ff;
        --muted: #99afc3;
        --accent: #6ec9ff;
        --accent-2: #5fe0c7;
        --warning: #f9c74f;
        --danger: #ff6b6b;
        --success: #4ad66d;
        --shadow: rgba(2, 12, 18, 0.5);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #050d12 0%, var(--bg) 100%);
        color: var(--text);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.2rem 2rem;
        border-bottom: 1px solid var(--line);
        background: rgba(7, 21, 29, 0.75);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }

      .brand-mark {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--accent) 0%, #0b3a59 35%, #07151d 70%);
        border: 2px solid rgba(110, 201, 255, 0.7);
        box-shadow: 0 0 20px rgba(110, 201, 255, 0.5);
      }

      .brand-text h1 {
        margin: 0;
        font-size: 1.6rem;
        letter-spacing: 0.12em;
      }

      .brand-text small {
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(12, 40, 52, 0.8);
        border: 1px solid rgba(110, 201, 255, 0.3);
        border-radius: 999px;
        padding: 0.5rem 0.9rem;
        font-size: 0.85rem;
        color: var(--accent-2);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        background: var(--success);
        box-shadow: 0 0 12px rgba(74, 214, 109, 0.9);
      }

      .layout {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem;
      }

      .dashboard {
        display: grid;
        grid-template-columns: repeat(4, minmax(180px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .card {
        background: linear-gradient(180deg, rgba(12, 28, 38, 0.98), rgba(11, 23, 34, 0.95));
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 1rem 1.1rem;
        box-shadow: 0 12px 30px var(--shadow);
      }

      .card h3 {
        margin: 0 0 0.5rem;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .card strong {
        font-size: 1.8rem;
        display: block;
      }

      .mini-meta {
        margin-top: 0.6rem;
        font-size: 0.78rem;
        color: var(--muted);
      }

      .bar-track {
        width: 100%;
        height: 8px;
        background: rgba(255,255,255,0.08);
        border-radius: 999px;
        margin-top: 0.6rem;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
        gap: 1.5rem;
      }

      form {
        display: grid;
        gap: 0.85rem;
      }

      .field,
      select,
      input,
      textarea {
        width: 100%;
        background: rgba(9, 20, 28, 0.9);
        border: 1px solid rgba(132, 189, 220, 0.2);
        border-radius: 10px;
        color: var(--text);
        padding: 0.8rem 0.9rem;
        font-size: 0.96rem;
      }

      textarea {
        min-height: 100px;
        resize: vertical;
      }

      label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.85rem;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 0.9rem 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), #2ca7d8);
        color: #021018;
      }

      .secondary {
        background: rgba(94, 224, 199, 0.12);
        border: 1px solid rgba(94, 224, 199, 0.4);
        color: var(--accent-2);
      }

      .list-wrap {
        min-height: 300px;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .toolbar h2 {
        margin: 0;
      }

      .toolbar-controls {
        display: flex;
        gap: 0.65rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .toolbar-controls input,
      .toolbar-controls select {
        min-width: 150px;
      }

      .issue-list {
        display: grid;
        gap: 1rem;
      }

      .issue-item {
        background: rgba(10, 22, 30, 0.95);
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        border-radius: 14px;
        padding: 1rem;
      }

      .issue-header {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .issue-title {
        font-size: 1.1rem;
        font-weight: 700;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0.75rem 0;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.28rem 0.6rem;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 0.71rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .priority-high { border-color: rgba(255, 107, 107, 0.6); color: #ffd4d4; }
      .priority-medium { border-color: rgba(249, 199, 79, 0.6); color: #ffe9b5; }
      .priority-low { border-color: rgba(94, 224, 199, 0.6); color: #c3fff4; }
      .status-open { color: #bff6ff; }
      .status-assigned { color: #d7d9ff; }
      .status-in_progress { color: #fbd277; }
      .status-resolved { color: #a4f7c4; }
      .status-closed { color: #d0d7de; }

      .issue-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .small {
        padding: 0.55rem 0.8rem;
        font-size: 0.85rem;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 2rem 1rem;
      }

      .alerts {
        margin-top: 1rem;
        min-height: 24px;
      }

      .alert {
        border-radius: 8px;
        padding: 0.7rem 0.9rem;
        margin-top: 0.5rem;
        font-size: 0.9rem;
      }

      .alert.success {
        background: rgba(74, 214, 109, 0.12);
        border: 1px solid rgba(74, 214, 109, 0.4);
        color: #d9ffe5;
      }

      .alert.error {
        background: rgba(255, 107, 107, 0.1);
        border: 1px solid rgba(255, 107, 107, 0.3);
        color: #ffd0d0;
      }

      [hidden] { display: none !important; }

      .health-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .dashboard { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
        .content-grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 600px) {
        .layout { padding: 1rem; }
        .dashboard { grid-template-columns: 1fr; }
        .row { grid-template-columns: 1fr; }
        .topbar { padding: 1rem; }
        .brand-text h1 { font-size: 1.2rem; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div class="brand-text">
          <h1>SCOUTOPS</h1>
          <small>Find. Track. Resolve.</small>
        </div>
      </div>
      <div class="brand">
        <div class="status-pill"><span class="dot"></span>Operations Healthy</div>
        <button class="secondary small" id="logout-btn" type="button" hidden>Sign out</button>
      </div>
    </header>

    <section class="layout" id="login-panel">
      <div class="card" style="max-width: 440px; margin: 3rem auto">
        <h2>Sign in to ScoutOps</h2>
        <p>Use your campus operations account to view or manage reported issues.</p>
        <form id="login-form">
          <div>
            <label for="login-username">Username</label>
            <input id="login-username" name="username" autocomplete="username" required />
          </div>
          <div>
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="primary" type="submit">Sign in</button>
        </form>
        <div class="alerts" id="login-alerts"></div>
      </div>
    </section>

    <main class="layout" id="app-panel" hidden>
      <section class="dashboard" id="dashboard"></section>

      <section class="content-grid">
        <aside class="card">
          <div class="toolbar">
            <h2>Report Issue</h2>
          </div>
          <form id="issue-form">
            <div>
              <label for="title">Title</label>
              <input id="title" name="title" type="text" placeholder="Broken lighting in East Wing" required />
            </div>

            <div>
              <label for="description">Description</label>
              <textarea id="description" name="description" placeholder="Describe the issue in detail..." required></textarea>
            </div>

            <div class="row">
              <div>
                <label for="category">Category</label>
                <select id="category" name="category" required>
                  <option value="ELECTRICAL">Electrical</option>
                  <option value="PLUMBING">Plumbing</option>
                  <option value="INTERNET">Internet</option>
                  <option value="CLEANING">Cleaning</option>
                  <option value="FURNITURE">Furniture</option>
                  <option value="EQUIPMENT">Equipment</option>
                  <option value="SECURITY">Security</option>
                  <option value="OTHER">Other</option>
                </select>
              </div>

              <div>
                <label for="priority">Priority</label>
                <select id="priority" name="priority" required>
                  <option value="LOW">Low</option>
                  <option value="MEDIUM" selected>Medium</option>
                  <option value="HIGH">High</option>
                  <option value="CRITICAL">Critical</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div>
                <label for="location">Location</label>
                <input id="location" name="location" type="text" placeholder="Library Annex" required />
              </div>

              <div>
                <label for="reporter_name">Reporter</label>
                <input id="reporter_name" name="reporter_name" type="text" placeholder="Student or staff name" required />
              </div>
            </div>

            <div class="issue-actions">
              <button type="submit" class="primary">Submit Issue</button>
              <button type="button" class="secondary small" id="reset-form">Reset</button>
            </div>
          </form>

          <div class="alerts" id="alerts"></div>
        </aside>

        <section class="card list-wrap">
          <div class="toolbar">
            <h2>Issue Queue</h2>
            <div class="toolbar-controls">
              <input id="issue-search" type="search" placeholder="Search issue or reporter" />
              <select id="status-filter">
                <option value="ALL">All statuses</option>
                <option value="OPEN">Open</option>
                <option value="ASSIGNED">Assigned</option>
                <option value="IN_PROGRESS">In progress</option>
                <option value="RESOLVED">Resolved</option>
                <option value="CLOSED">Closed</option>
              </select>
              <button class="secondary small" id="refresh-btn" type="button">Refresh</button>
            </div>
          </div>
          <div id="issue-list" class="issue-list"></div>
        </section>
      </section>
    </main>

    <script>
      const dashboard = document.getElementById('dashboard');
      const issueList = document.getElementById('issue-list');
      const issueForm = document.getElementById('issue-form');
      const alerts = document.getElementById('alerts');
      const issueSearch = document.getElementById('issue-search');
      const statusFilter = document.getElementById('status-filter');
      const loginPanel = document.getElementById('login-panel');
      const appPanel = document.getElementById('app-panel');
      const loginForm = document.getElementById('login-form');
      const loginAlerts = document.getElementById('login-alerts');
      const logoutButton = document.getElementById('logout-btn');
      let currentUser = null;
      let staffUsers = [];
      let allIssues = [];

      const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[character]);

      const apiFetch = (url, options = {}) => {
        const token = sessionStorage.getItem('scoutops-token');
        const headers = new Headers(options.headers || {});
        if (token) headers.set('Authorization', `Bearer ${token}`);
        return fetch(url, { ...options, headers });
      };

      const showAuthenticatedApp = (user) => {
        currentUser = user;
        loginPanel.hidden = true;
        appPanel.hidden = false;
        logoutButton.hidden = false;
        loadIssues();
        if (user.role === 'staff' || user.role === 'admin') loadStaffUsers();
      };

      const setAlert = (message, type = 'success') => {
        alerts.innerHTML = `<div class="alert ${type}">${escapeHTML(message)}</div>`;
      };

      const badgeClass = (priority) => {
        const p = (priority || '').toUpperCase();
        if (p === 'CRITICAL') return 'priority-high';
        if (p === 'HIGH') return 'priority-high';
        if (p === 'MEDIUM') return 'priority-medium';
        return 'priority-low';
      };

      const statusClass = (status) => {
        const s = (status || '').toUpperCase().replace(/\s+/g, '_');
        return `status-${s.toLowerCase()}`;
      };

      const renderDashboard = (counts, totalIssues) => {
        const resolutionRate = totalIssues ? Math.round(((counts.resolved || 0) / totalIssues) * 100) : 0;
        const criticalShare = totalIssues ? Math.round(((counts.critical || 0) / totalIssues) * 100) : 0;

        const cards = [
          ['Open', counts.open || 0, `${Math.max(0, totalIssues - counts.closedOrResolved)} active`],
          ['Assigned', counts.assigned || 0, `${counts.inProgress || 0} in progress`],
          ['Resolved', counts.resolved || 0, `${resolutionRate}% resolution rate`],
          ['Urgent', counts.critical || 0, `${criticalShare}% critical load`],
        ];

        dashboard.innerHTML = cards.map(([label, value, meta]) => `
          <div class="card">
            <h3>${label}</h3>
            <strong>${value}</strong>
            <div class="mini-meta">${meta}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100, value && totalIssues ? (value / totalIssues) * 100 : 0)}%"></div></div>
          </div>
        `).join('');
      };

      const applyFilters = () => {
        const search = (issueSearch.value || '').trim().toLowerCase();
        const selectedStatus = statusFilter.value;

        const filtered = allIssues.filter((issue) => {
          const matchesStatus = selectedStatus === 'ALL' || issue.status === selectedStatus;
          const text = `${issue.title} ${issue.description} ${issue.location} ${issue.reporter_name}`.toLowerCase();
          const matchesSearch = !search || text.includes(search);
          return matchesStatus && matchesSearch;
        });

        renderIssues(filtered);
      };

      const renderIssues = (issues) => {
        if (!issues.length) {
          issueList.innerHTML = '<div class="empty">No matching issues found. Adjust search or submit a new mission report.</div>';
          return;
        }

        issueList.innerHTML = issues.map((issue) => `
          <article class="issue-item">
            <div class="issue-header">
              <div>
                <div class="issue-title">${escapeHTML(issue.title)}</div>
                <div class="meta">
                  <span class="badge ${badgeClass(issue.priority)}">${escapeHTML(issue.priority)}</span>
                  <span class="badge ${statusClass(issue.status)}">${escapeHTML(issue.status)}</span>
                  <span class="badge">${escapeHTML(issue.category)}</span>
                </div>
              </div>
              <span class="badge">#${escapeHTML(issue.id)}</span>
            </div>
            <p>${escapeHTML(issue.description)}</p>
            <div class="meta">
              <span class="badge">Location: ${escapeHTML(issue.location)}</span>
              <span class="badge">Reporter: ${escapeHTML(issue.reporter_name)}</span>
              <span class="badge">Assigned: ${escapeHTML(issue.assigned_to_username || 'Unassigned')}</span>
              <span class="badge">Created: ${escapeHTML(new Date(issue.created_at).toLocaleDateString())}</span>
            </div>
            <div class="issue-actions">
              ${(currentUser.role === 'staff' || currentUser.role === 'admin') ? `
                <button class="secondary small" type="button" data-action="status" data-id="${escapeHTML(issue.id)}">Advance Status</button>
                <button class="secondary small" type="button" data-action="history" data-id="${escapeHTML(issue.id)}">History</button>
                <select aria-label="Assign issue #${escapeHTML(issue.id)}" data-assignee-for="${escapeHTML(issue.id)}">
                  <option value="">Unassigned</option>
                  ${staffUsers.map((user) => `<option value="${escapeHTML(user.id)}" ${Number(issue.assigned_to) === Number(user.id) ? 'selected' : ''}>${escapeHTML(user.username)}</option>`).join('')}
                </select>
                <button class="secondary small" type="button" data-action="assign" data-id="${escapeHTML(issue.id)}">Assign</button>
              ` : ''}
              ${currentUser.role === 'admin' ? `<button class="secondary small" type="button" data-action="delete" data-id="${escapeHTML(issue.id)}">Delete</button>` : ''}
            </div>
            <div class="issue-history" data-history-for="${escapeHTML(issue.id)}"></div>
          </article>
        `).join('');
      };

      const loadIssues = async () => {
        try {
          const response = await apiFetch('/api/issues');
          if (!response.ok) {
            throw new Error('Unable to load issues');
          }
          allIssues = await response.json();
          applyFilters();

          const counts = {
            open: allIssues.filter((issue) => issue.status === 'OPEN').length,
            assigned: allIssues.filter((issue) => issue.status === 'ASSIGNED').length,
            resolved: allIssues.filter((issue) => issue.status === 'RESOLVED' || issue.status === 'CLOSED').length,
            critical: allIssues.filter((issue) => issue.priority === 'CRITICAL').length,
            inProgress: allIssues.filter((issue) => issue.status === 'IN_PROGRESS').length,
            closedOrResolved: allIssues.filter((issue) => issue.status === 'RESOLVED' || issue.status === 'CLOSED').length,
          };

          renderDashboard(counts, allIssues.length);
        } catch (error) {
          issueList.innerHTML = '<div class="empty">Failed to load issues. Check ScoutOps status and API availability.</div>';
        }
      };

      const refreshHealth = async () => {
        try {
          const response = await fetch('/health');
          const payload = await response.json();
          document.querySelector('.status-pill').innerHTML = `<span class="dot"></span>${payload.status === 'UP' ? 'Operations Healthy' : 'Operations Unstable'}`;
        } catch (error) {
          document.querySelector('.status-pill').innerHTML = '<span class="dot"></span>Operations Unstable';
        }
      };

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginAlerts.innerHTML = '';
        const credentials = Object.fromEntries(new FormData(loginForm).entries());
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(credentials),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.error || 'Sign in failed.');
          sessionStorage.setItem('scoutops-token', body.token);
          showAuthenticatedApp(body.user);
        } catch (error) {
          loginAlerts.innerHTML = `<div class="alert error">${escapeHTML(error.message || 'Sign in failed.')}</div>`;
        }
      });

      logoutButton.addEventListener('click', () => {
        sessionStorage.removeItem('scoutops-token');
        currentUser = null;
        appPanel.hidden = true;
        loginPanel.hidden = false;
        logoutButton.hidden = true;
        issueList.innerHTML = '';
        dashboard.innerHTML = '';
      });

      const loadStaffUsers = async () => {
        try {
          const response = await apiFetch('/api/users');
          if (!response.ok) throw new Error('Unable to load staff directory.');
          staffUsers = await response.json();
          applyFilters();
        } catch (error) {
          setAlert(error.message, 'error');
        }
      };

      issueForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(issueForm).entries());

        try {
          const response = await apiFetch('/api/issues', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          const body = await response.json();
          if (!response.ok) {
            throw new Error(body.error || 'Issue creation failed');
          }

          setAlert('Issue created successfully.', 'success');
          issueForm.reset();
          await loadIssues();
        } catch (error) {
          setAlert(error.message || 'Issue creation failed.', 'error');
        }
      });

      issueList.addEventListener('click', async (event) => {
        const button = event.target.closest('button');
        if (!button) return;

        const { action, id } = button.dataset;
        if (!id) return;

        try {
          if (action === 'delete') {
            const response = await apiFetch(`/api/issues/${id}`, { method: 'DELETE' });
            const body = await response.json();
            if (!response.ok) {
              throw new Error(body.error || 'Delete failed');
            }
            setAlert('Issue removed successfully.', 'success');
          }

          if (action === 'status') {
            const issueResponse = await apiFetch(`/api/issues/${id}`);
            const issue = await issueResponse.json();
            const nextStatus = issue.status === 'OPEN'
              ? 'ASSIGNED'
              : issue.status === 'ASSIGNED'
                ? 'IN_PROGRESS'
                : issue.status === 'IN_PROGRESS'
                  ? 'RESOLVED'
                  : 'CLOSED';

            const patchResponse = await apiFetch(`/api/issues/${id}/status`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: nextStatus }),
            });
            const patchBody = await patchResponse.json();
            if (!patchResponse.ok) {
              throw new Error(patchBody.error || 'Status update failed');
            }
            setAlert(`Issue status updated to ${patchBody.status}.`, 'success');
          }

          if (action === 'assign') {
            const select = issueList.querySelector(`[data-assignee-for="${CSS.escape(id)}"]`);
            const response = await apiFetch(`/api/issues/${id}/assignment`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ assigned_to: select.value || null }),
            });
            const body = await response.json();
            if (!response.ok) throw new Error(body.error || 'Assignment failed.');
            setAlert('Issue assignment updated.', 'success');
          }

          if (action === 'history') {
            const response = await apiFetch(`/api/issues/${id}/history`);
            const history = await response.json();
            if (!response.ok) throw new Error(history.error || 'Unable to load issue history.');
            const target = issueList.querySelector(`[data-history-for="${CSS.escape(id)}"]`);
            target.innerHTML = history.length
              ? `<p>${history.map((entry) => `${escapeHTML(entry.old_status)} → ${escapeHTML(entry.new_status)} by ${escapeHTML(entry.changed_by || 'system')} (${escapeHTML(new Date(entry.changed_at).toLocaleString())})`).join('<br>')}</p>`
              : '<p>No status changes recorded.</p>';
          }

          if (action !== 'history') await loadIssues();
        } catch (error) {
          setAlert(error.message || 'Issue action failed.', 'error');
        }
      });

      issueSearch.addEventListener('input', applyFilters);
      statusFilter.addEventListener('change', applyFilters);

      document.getElementById('refresh-btn').addEventListener('click', async () => {
        await loadIssues();
        await refreshHealth();
      });

      document.getElementById('reset-form').addEventListener('click', () => issueForm.reset());

      refreshHealth();
      const savedToken = sessionStorage.getItem('scoutops-token');
      if (savedToken) {
        apiFetch('/api/auth/me').then((response) => {
          if (!response.ok) throw new Error('Session expired.');
          return response.json();
        }).then(showAuthenticatedApp).catch(() => {
          sessionStorage.removeItem('scoutops-token');
        });
      }
    </script>
  </body>
</html>
