services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scoutops_test
      POSTGRES_USER: scoutops_test
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for the test database}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
